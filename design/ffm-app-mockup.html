/* ================= keyboard ================= */
const DIGIT = /^[0-9]$/;
/* Real mouse movement clears this immediately, so hover returns the moment
   the mouse is the thing actually moving again. */
document.addEventListener('mousemove', () => document.body.classList.remove('kbd-nav'), {passive:true});
document.addEventListener('keydown', e => {
  document.body.classList.add('kbd-nav');
  /* The recurring-row tooltip is shown/hidden purely by real mouse position
     (see the mousemove listener below) — it has no idea the keyboard just
     moved the actual cursor elsewhere, so without this it can be left
     dangling over a row that isn't focused anymore, or covering a row that
     now is. Any keypress kills it outright, the same instant kbd-nav kicks
     in; a real mousemove is what's allowed to bring it back. */
  $('#tip').style.display = 'none';
  const inField = e.target.closest('input,select,textarea');

  if(mpop.classList.contains('on')){
    if(e.key === 'Escape'){ e.preventDefault(); closePicker(); $('#app').focus(); return; }
  }
  if(inField && e.target.id === 'cfgText'){
    if(e.key === 'Escape'){ e.preventDefault(); closeCfg(); }
    return;
  }
  if(inField && e.target.id === 'cmdInput'){
    if(S.mode === 'SEARCH'){
      if(e.key === 'Enter'){
        e.preventDefault();
        const ms = matchesOf();
        closeCmd();
        if(!S.q) say('search cleared');
        else if(!ms.length) say('E486: pattern not found · /' + S.q, true);
        else {
          const at = ms.findIndex(m => m.p === S.panel && m.i === S.focus[S.panel]);
          say('/' + S.q + ' · ' + (at + 1) + '/' + ms.length + ' · n / N to step');
        }
      }
      if(e.key === 'Escape'){
        e.preventDefault();
        setQuery('');
        S.panel = S.origin.panel;
        S.focus[S.panel] = Math.min(S.origin.focus, view(S.panel).length - 1);
        closeCmd(); say('search cancelled');
      }
      return;
    }
    if(e.key === 'Enter'){ e.preventDefault(); runCmd($('#cmdInput').value); }
    if(e.key === 'Escape'){ e.preventDefault(); closeCmd(); say('cancelled'); }
    return;
  }
  if($('#scrim').classList.contains('on')){
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(); }
    if(!inField && (e.key === 'y' || e.key === 'Y') && $('#modal').querySelector('[data-act="del"]')){
      e.preventDefault(); softDelete();
    }
    if(e.ctrlKey && MODAL_DIRS[e.key]){ e.preventDefault(); modalFocusMove(MODAL_DIRS[e.key]); }
    /* Enter on the bucket combobox is never "save the form" — it's
       ambiguous with "confirm the highlighted <datalist> suggestion", and
       browsers don't agree on which one wins. Chrome swallows that Enter
       inside its own suggestion-list handling before it ever reaches this
       listener; Safari doesn't, so the very keystroke meant to pick a
       bucket value falls through and closes the whole modal instead. Rather
       than guess at Safari's exact event sequence, this field is simply
       carved out of the generic Enter-saves rule below: Enter here only
       blurs it (which is also what dismisses an open suggestion list),
       leaving the value it just picked in place. A second Enter — now from
       anywhere else — saves for real. */
    if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'eB'){
      e.preventDefault();
      document.activeElement.blur();
      return;
    }
    /* Enter = whatever the modal's own primary button does — saveOcc for
       the edit-occurrence form, Close for a modal with no real save action
       (help, edit rule). Deliberately no fallback to .dgr: the delete
       confirm's only "yes" is the explicit y keypress above, so Enter never
       becomes an accidental way to confirm a destructive action. */
    if(e.key === 'Enter'){
      const primary = $('#modal').querySelector('[data-act="saveOcc"], .mfoot .btn.pri');
      if(primary){
        e.preventDefault();
        /* Blur whatever field is focused before tearing the modal down —
           a datalist-backed input (Bucket) can have its native suggestion
           popup open, and that popup is browser chrome outside the page's
           own DOM/CSS. Removing the field from under it without blurring
           first can leave it visually stuck on screen with nothing left to
           anchor to. Blurring is what a browser already treats as "dismiss
           the suggestions", so doing it explicitly, before the field is
           gone, is what actually closes it. */
        if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
        primary.click();
      }
    }
    return;
  }
  if(inField) return;

  if(e.ctrlKey && (e.key === 'p' || e.key === 'n')){ e.preventDefault(); month(e.key==='n'?1:-1); return; }
  if(e.ctrlKey && (e.key === 'h' || e.key === 'l')){ e.preventDefault(); sendRow(e.key==='l'?1:-1); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;

  const k = e.key;

  /* g1/g2/g3 open a file by fixed kind (bill/scheduled/receipt) on the
     focused row — checked before the digit-count buffer below, or the '1'
     in g1 would just get swallowed as a count prefix instead of reaching
     this block. Not stock Vim: a genuine extension of the existing g-prefix
     "goto" vocabulary (gg, gt), same treatment as p (proposal). */
  if(S.buf === 'g' && (k === '1' || k === '2' || k === '3')){
    S.buf=''; e.preventDefault();
    openFile(cur(), +k);
    render();
    return;
  }

  if(DIGIT.test(k) && !(k === '0' && !S.count)){ S.count += k; render(); e.preventDefault(); return; }

  if(S.buf === 'd'){
    S.buf=''; e.preventDefault();
    if(k === 'd') confirmDelete(); else { render(); say('d' + k + ' is not a motion', true); }
    return;
  }
  if(S.buf === 'g'){
    S.buf=''; e.preventDefault();
    if(k === 'g'){ S.focus[S.panel]=0; S.count=''; render(); }
    else if(k === 't'){ gotoTab(1); }
    else if(k === 'T'){ gotoTab(-1); }
    else if(k === 'd'){ S.count=''; showDetailsForFocused(); }
    else { S.count=''; render(); }
    return;
  }
  if(S.buf === 'z'){
    S.buf=''; e.preventDefault();
    if(CFG.group !== 'bucket'){ render(); say('not grouped · :group bucket', true); return; }
    const b = bucketOf(cur());
    if(k === 'a' && b){ S.foldClosed[S.panel].has(b) ? S.foldClosed[S.panel].delete(b) : S.foldClosed[S.panel].add(b); }
    else if(k === 'o' && b){ S.foldClosed[S.panel].delete(b); }
    else if(k === 'c' && b){ S.foldClosed[S.panel].add(b); }
    else if(k === 'R'){ S.foldClosed[S.panel].clear(); }
    else if(k === 'M'){ allBucketsOf(S.panel).forEach(x => S.foldClosed[S.panel].add(x)); }
    clampFocusToVisible(S.panel);
    render();
    return;
  }

  switch(k){
    case 'j': case 'ArrowDown': e.preventDefault(); move(1); break;
    case 'k': case 'ArrowUp':   e.preventDefault(); move(-1); break;
    case 'd': e.preventDefault(); S.buf='d'; render(); break;
    case 'g': e.preventDefault(); S.buf='g'; render(); break;
    case 'z': e.preventDefault(); S.buf='z'; render(); break;
    case 'G': e.preventDefault(); S.focus[S.panel]=rowsOf(S.panel).length-1; S.count=''; render(); break;
    case 'J': e.preventDefault(); moveRows(1); break;
    case 'K': e.preventDefault(); moveRows(-1); break;
    case 'H': e.preventDefault(); switchPanel(0); break;
    case 'L': e.preventDefault(); switchPanel(1); break;
    case 'x': e.preventDefault(); toggleSel(); break;
    case 'p': e.preventDefault(); togglePrivate(); break;
    case 'u': e.preventDefault(); doUndo(); break;
    case 'e': e.preventDefault(); editOccurrence(); break;
    case 'R': e.preventDefault(); editRule(); break;
    case 'a': e.preventDefault(); openCmd(':'); $('#cmdInput').value='add '; break;
    case 'i': e.preventDefault(); openCmd(':'); $('#cmdInput').value='add '; break;
    case '/': e.preventDefault(); openCmd('/'); break;
    case ':': e.preventDefault(); openCmd(':'); break;
    case 'n': e.preventDefault(); jumpMatch(1); break;
    case 'N': e.preventDefault(); jumpMatch(-1); break;
    case '?': e.preventDefault(); helpModal(); break;
    case 'Escape': {
      e.preventDefault();
      const had = clearSearch();
      S.count=''; S.buf=''; S.sel=[new Set(),new Set()];
      render();
      if(had) say('search cleared');
      break;
    }
  }
});

/* ================= mouse ================= */
$('#panels').addEventListener('click', e => {
  if(e.target.closest('[data-role-toggle]')){ togglePreview(); return; }
  const fb = e.target.closest('.fbadge');
  if(fb){
    const p = +fb.dataset.p, i = +fb.dataset.i, n = +fb.dataset.n;
    S.panel = p; S.focus[p] = i; S.count='';
    openFile(view(p)[i], n);
    render();
    return;
  }
  const fh = e.target.closest('.fhead');
  if(fh){
    const p = +fh.dataset.p, b = fh.dataset.b;
    S.foldClosed[p].has(b) ? S.foldClosed[p].delete(b) : S.foldClosed[p].add(b);
    clampFocusToVisible(p);
    render();
    return;
  }
  const rt = e.target.closest('[data-retry]');
  if(rt){
    const id = +rt.dataset.retry;
    for(let p=0;p<2;p++){ const t = rowsOf(p).find(x=>x.id===id);
      if(t){ t.state='skeleton'; render();
        setTimeout(()=>{ if(S.online){ t.state='ok'; S.undo.push({k:'add',p,id:t.id}); say('added #'+t.id); }
          else { t.state='error'; say('still unreachable', true); } render(); }, 780); } }
    return;
  }
  const row = e.target.closest('.row');
  if(row){
    /* e.detail (the browser's own same-spot rapid-click counter) rather than
       the native dblclick event: every click here calls render(), which
       replaces the row element under the pointer, and Chrome never promotes
       that second click to a dblclick once the target stops being the same
       node — even though it still correctly counts it as click #2 at the
       same position. detail is the one signal that survives the re-render. */
    const isDbl = e.detail >= 2;
    S.panel = +row.dataset.p; S.focus[S.panel] = +row.dataset.i; S.count=''; render(); $('#app').focus();
    if(isDbl) editOccurrence();
    return;
  }
  const pan = e.target.closest('.panel');
  if(pan) switchPanel(+pan.dataset.panel);
});

/* hover tooltip on recurring rows — also reachable via gd for keyboard-only
   use (see showDetailsForFocused below), since the mouse-driven version had
   no keyboard equivalent at all. */
const tip = $('#tip');
function tipHTML(t){
  return '<b>' + esc(t.title) + '</b><div class="hr"></div>'
    + 'Due: ' + (t.due || 'day ' + pad(t.day) + ' each month') + '<br>'
    + 'Cadence: monthly · since 01/03/2024<br>'
    + (t.tracked
        ? 'Receipt: ' + esc(t.pattern || '—') + '<br>' + (t.status==='paid'
            ? '<span style="color:var(--pos)">found on disk → paid</span>'
            : '<span style="color:var(--accent)">not found yet → unpaid</span>')
        : '<span style="color:var(--ink-3)">tracking off · no paid state</span>');
}
$('#panels').addEventListener('mousemove', e => {
  const row = e.target.closest('.row');
  if(!row){ tip.style.display='none'; return; }
  const t = view(+row.dataset.p)[+row.dataset.i];
  if(!t || !t.recurring || t.state !== 'ok'){ tip.style.display='none'; return; }
  tip.innerHTML = tipHTML(t);
  tip.style.display='block';
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if(x + r.width > innerWidth - 10) x = e.clientX - r.width - 14;
  if(y + r.height > innerHeight - 10) y = e.clientY - r.height - 14;
  tip.style.left = (x + scrollX) + 'px'; tip.style.top = (y + scrollY) + 'px';
});
$('#panels').addEventListener('mouseleave', () => tip.style.display='none');

/* gd — the keyboard equivalent of hovering the focused row: same content,
   same element, just anchored to the row's own position instead of a
   pointer that doesn't exist for a keyboard action. Dismissed the same way
   any other hover artifact is (see the kbd-nav suppression above) — the
   very next keypress, of any kind, hides it again. */
function showDetailsForFocused(){
  const t = cur();
  render(); /* clears the g/d buffer out of the statusline either way */
  if(!t || !t.recurring){ say('not generated from a recurring rule', true); return; }
  if(t.state !== 'ok') return;
  const rowEl = document.querySelector('.row.focus');
  if(!rowEl) return;
  tip.innerHTML = tipHTML(t);
  tip.style.display = 'block';
  const rr = rowEl.getBoundingClientRect(), r = tip.getBoundingClientRect();
  let x = rr.right - r.width, y = rr.bottom + 8;
  if(y + r.height > innerHeight - 10) y = rr.top - r.height - 8;
  if(x < 10) x = 10;
  tip.style.left = (x + scrollX) + 'px'; tip.style.top = (y + scrollY) + 'px';
}

$('#scrim').addEventListener('click', e => {
  if(e.target === $('#scrim')){ closeModal(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'close') closeModal();
  if(a === 'del') softDelete();
  if(a === 'send'){ const t = pendingSend; pendingSend = null; closeModal(); if(t != null) doSend(t); }
  if(a === 'saveOcc'){
    const t = cur(); if(!t){ closeModal(); return; }
    const prev = {title:t.title, amount:t.amount, day:t.day, private:t.private, bucket:t.bucket};
    t.title = $('#eT').value || t.title;
    const cents = parseInt($('#eA').dataset.cents || '0', 10);
    if(isFinite(cents)) t.amount = cents / Math.pow(10, curFmt().decimals);
    const d = parseInt($('#eD').value,10); if(d>=1 && d<=31) t.day = d;
    t.private = $('#eP').checked;
    t.bucket = $('#eB').value.trim() || null;
    S.undo.push({k:'edit', p:S.panel, id:t.id, prev});
    const want = +$('#eM').value;
    closeModal();
    if(want !== S.panel){ S.sel[S.panel] = new Set(); sendRow(want - S.panel); }
    else say('occurrence updated');
  }
});

/* ---- month picker ---- */
const mpop = $('#mpop'), mbtn = $('#monthBtn');
function monthNet(i){
  return MONTHS[i].m.reduce((a, rows) => a + rows.reduce((b,t) =>
    b + (t.deleted || t.state !== 'ok' ? 0 : (t.kind === 'in' ? t.amount : -t.amount)), 0), 0);
}
/* Unresolved = a tracked occurrence overdue with no receipt (pending fully
   elapsed, or scheduled-overdue). Checked for months strictly before "now",
   within the current year only — MONTHS never spans more than one year here.
   Real implementation also filters by viewer privacy; this mock has one
   implicit (admin) viewpoint, so nothing to filter. */
function monthHasIssue(i){
  if(i >= TODAY_M) return false;
  return MONTHS[i].m.some(rows => rows.some(t =>
    !t.deleted && (t.status === 'scheduled-overdue' || (t.status === 'pending' && t.progress >= 1))));
}
function yearHasIssue(){ return MONTHS.some((_, i) => monthHasIssue(i)); }
function drawPicker(){
  mpop.innerHTML = '<div class="yr"><b>2026</b><span>select month</span></div><div class="mgrid">'
    + MONTHS.map((M,i) => {
        const net = monthNet(i);
        const cls = ['mcell']; if(i===S.mi) cls.push('on'); if(M.now) cls.push('now'); if(M.future) cls.push('fut');
        return '<button class="' + cls.join(' ') + '" data-m="' + i + '" type="button">' + MN[i]
          + '<span class="n">' + (M.future ? 'projected' : (net<0?'−':'+') + Math.round(Math.abs(net)/1000) + 'k')
          + '</span>' + (monthHasIssue(i) ? '<span class="idot" title="overdue, no receipt"></span>' : '')
          + '</button>';
      }).join('')
    + '</div><div class="ft"><i style="display:inline-block;width:14px;height:3px;background:var(--info);'
    + 'border-radius:2px;vertical-align:middle"></i> current month · 09/2026<br>'
    + 'projected = recurring rules only, not yet materialized</div>';
}
function openPicker(){
  drawPicker(); mpop.classList.add('on'); mbtn.setAttribute('aria-expanded','true');
  const r = mbtn.getBoundingClientRect(), w = 318;
  let x = Math.min(r.left, innerWidth - w - 12);
  let y = r.bottom + 8;
  if(y + mpop.offsetHeight > innerHeight - 10) y = Math.max(10, r.top - mpop.offsetHeight - 8);
  mpop.style.left = Math.max(10, x) + 'px'; mpop.style.top = y + 'px';
}
function closePicker(){ mpop.classList.remove('on'); mbtn.setAttribute('aria-expanded','false'); }

  ['Type', [[':','open the command bar'],[':add 50 mercado publix','a spend, in one line'],[':in 2400 freelance','an incoming'],[':move ana','re-attribute to another member'],[':sort date','row order: manual · date · amount'],[':group bucket','group by category · :group none to flatten'],[':set rnu','gutter: relative · absolute · off'],[':theme gruvbox','colorscheme (writes ffm.toml)'],[':currency usd','household currency, admin-only (writes ffm.toml)'],[':config','open ffm.toml beside the ledger'],[':preview','toggle previewing as a non-admin member'],['?','this keymap']]]
];
const KEYHTML = KEYGROUPS.map(([g, rows]) =>
  '<div class="kgroup"><h4>' + g + '</h4>' + rows.map(([k,d]) =>
    '<div class="krow"><kbd>' + esc(k) + '</kbd><span class="d">' + esc(d) + '</span></div>').join('') + '</div>').join('');
