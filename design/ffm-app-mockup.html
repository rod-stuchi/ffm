<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  FFM — Family Finances Manager · full-viewport app mockup
  / searches the ledger, : runs commands. J/K reorder, Ctrl-H/L re-attribute,
  split / tabbed panes, 11 Neovim colorschemes — all driven live by an editable
  ffm.toml opened as a vsplit. Self-contained: no build step, no dependencies.
-->
<style>
  :root{color-scheme:light dark}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>FFM Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --paper:#F6F3ED;
  --surface:#FFFDF8;
  --surface-2:#EEE9DE;
  --surface-3:#E6E0D2;
  --ink:#211E19;
  --ink-2:#5C554A;
  --ink-3:#8E8578;
  --line:#E1DACC;
  --line-2:#CDC4B1;
  --accent:#A8620A;
  --accent-2:#C9800F;
  --accent-soft:rgba(168,98,10,.10);
  --accent-line:rgba(168,98,10,.35);
  --pos:#3D7A4B;
  --pos-soft:rgba(61,122,75,.13);
  --neg:#B23A2B;
  --neg-soft:rgba(178,58,43,.11);
  --info:#3F6288;
  --shadow-sm:0 1px 2px rgba(46,36,18,.07);
  --shadow-md:0 2px 4px rgba(46,36,18,.05),0 12px 28px rgba(46,36,18,.09);
  --skeleton:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 45%,var(--surface-2) 90%);
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171512;
    --surface:#201D18;
    --surface-2:#2A261E;
    --surface-3:#353026;
    --ink:#EEE8DB;
    --ink-2:#B2A995;
    --ink-3:#807869;
    --line:#332E25;
    --line-2:#474032;
    --accent:#E9A63F;
    --accent-2:#F5C173;
    --accent-soft:rgba(233,166,63,.11);
    --accent-line:rgba(233,166,63,.34);
    --pos:#82B47D;
    --pos-soft:rgba(130,180,125,.14);
    --neg:#E28470;
    --neg-soft:rgba(226,132,112,.13);
    --info:#8FB0D6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 2px 4px rgba(0,0,0,.3),0 14px 32px rgba(0,0,0,.42);
    --skeleton:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 45%,var(--surface-2) 90%);
  }
}
:root[data-theme="dark"]{
  --paper:#171512;
  --surface:#201D18;
  --surface-2:#2A261E;
  --surface-3:#353026;
  --ink:#EEE8DB;
  --ink-2:#B2A995;
  --ink-3:#807869;
  --line:#332E25;
  --line-2:#474032;
  --accent:#E9A63F;
  --accent-2:#F5C173;
  --accent-soft:rgba(233,166,63,.11);
  --accent-line:rgba(233,166,63,.34);
  --pos:#82B47D;
  --pos-soft:rgba(130,180,125,.14);
  --neg:#E28470;
  --neg-soft:rgba(226,132,112,.13);
  --info:#8FB0D6;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 4px rgba(0,0,0,.3),0 14px 32px rgba(0,0,0,.42);
  --skeleton:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 45%,var(--surface-2) 90%);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:28px 22px 90px}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============ masthead ============ */
kbd{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line-2);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink);white-space:nowrap}

/* ============ app shell ============ */
.app{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow-md);overflow:hidden;position:relative}
.app:focus{outline:none}
.app.armed{border-color:var(--accent-line)}

.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:78px;
  padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.monthnav{display:flex;align-items:center;gap:5px}
.mbtn{width:30px;height:30px;display:grid;place-items:center;background:transparent;border:1px solid transparent;
  border-radius:7px;color:var(--ink-2);cursor:pointer;font-family:var(--mono);font-size:15px}
.mbtn:hover{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.mpick{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink);height:38px;position:relative}
.mpick .month{font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:.01em;min-width:104px;text-align:center}
.mpick .car{font-size:9px;color:var(--ink-3);line-height:1}
.mpick:hover{border-color:var(--accent-line)}
.mpick:hover .car{color:var(--accent)}
.mpick[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mdot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--neg);border:2px solid var(--paper);display:none}
.mdot.on{display:block}
.topbar .spacer{flex:1}
.hh{display:flex;align-items:stretch}
.hh div{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:2px 16px;border-left:1px solid var(--line)}
.hh div:first-child{border-left:none}
.hh span.k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.hh b{font-family:var(--mono);font-size:15.5px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* month picker */
.mpop{position:fixed;z-index:70;display:none;width:318px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-md);padding:13px}
.mpop.on{display:block}
.mpop .yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mpop .yr b{font-family:var(--mono);font-size:13px;letter-spacing:.1em;font-weight:700}
.mpop .yr span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mcell{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:8px 4px 7px;cursor:pointer;color:var(--ink);
  font-family:var(--mono);font-size:13px;font-weight:500;position:relative}
.mcell:hover{border-color:var(--accent-line);background:var(--surface-2)}
.mcell .n{font-size:9.5px;font-weight:400;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mcell.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.mcell.on .n{color:var(--accent)}
.mcell.now{box-shadow:inset 0 -2px 0 var(--info)}
.mcell.fut .n{color:var(--accent-2)}
.mcell .idot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--neg)}
.mpop .ft{font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1.7;margin-top:10px;
  padding-top:9px;border-top:1px solid var(--line)}
.mpop .ft i{font-style:normal;color:var(--info)}
.netdot{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;
  border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;cursor:pointer;background:var(--surface);color:var(--ink-2)}
.netdot i{width:6px;height:6px;border-radius:50%;background:var(--pos);display:block}
.netdot.off{color:var(--neg);border-color:var(--neg)}
.netdot.off i{background:var(--neg)}

/* ============ panels ============ */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:0}
.panel{border-right:1px solid var(--line);min-width:0;position:relative}
.panel:last-child{border-right:none}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 0 var(--accent);transition:box-shadow .12s}
.panel.active::before{box-shadow:inset 0 0 0 2px var(--accent-line)}
.panel.active .p-name{color:var(--accent)}

.p-head{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.p-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.p-name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.p-role{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent-line);border-radius:4px;padding:1px 5px;background:var(--accent-soft);
  cursor:pointer}
/* Preview state gets its own colour channel (info, not accent) on purpose —
   accent already means "you are here" everywhere else in this app (focus
   rail, gutter zero, mode badge); reusing it here would make "I'm admin"
   and "I'm previewing as non-admin" look like the same kind of fact when
   they're opposites. */
.p-role.preview{color:var(--info);border-color:var(--info);background:transparent}
.p-key{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.sums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sum{background:var(--surface-2);padding:7px 10px}
.sum .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.sum .v{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:1px}
.sum.in .v{color:var(--pos)}
.sum.out .v{color:var(--ink)}
.sum.bal .v.neg{color:var(--neg)}

.ledger{padding:6px 0 8px;max-height:430px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}

/* ============ row ============ */
.row{display:grid;grid-template-columns:34px 1fr;align-items:stretch;
  border-left:3px solid transparent;padding:1px 10px 1px 0;position:relative}
.row.focus{border-left-color:var(--accent);background:var(--accent-soft)}
.gut{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:right;padding:11px 8px 0 0;
  font-variant-numeric:tabular-nums;user-select:none}
.row.focus .gut{color:var(--accent);font-weight:700}
/* nonu keeps the gutter cell in the grid — collapsing it with display:none would
   reflow .entry into the first track and crush the row. */
.row.nogut{grid-template-columns:10px 1fr}
.row.nogut .gut{padding-right:0;overflow:hidden}

.entry{display:grid;grid-template-columns:26px 1fr auto auto;gap:11px;align-items:center;
  background:var(--surface-2);border-radius:var(--r);padding:8px 12px;min-width:0;cursor:pointer;
  border:1px solid transparent;transition:background .1s}
/* Suppressed while navigating by keyboard (body.kbd-nav) — otherwise the
   physical mouse position keeps painting a second, unrelated highlight
   while j/k moves the real (.row.focus) cursor somewhere else. Any real
   mouse movement clears kbd-nav and hover comes right back. */
body:not(.kbd-nav) .row:hover .entry{background:var(--surface-3)}
.row.focus .entry{background:var(--surface-2);border-color:var(--accent-line)}
.row.sel .entry{box-shadow:inset 3px 0 0 var(--info)}
.row.deleted .entry{opacity:.5}
.row.deleted .name b{text-decoration:line-through}
.row.deleted .amt .v{text-decoration:line-through}

.mark{width:26px;height:26px;position:relative;display:grid;place-items:center}
.mark svg{position:absolute;inset:0;width:26px;height:26px;transform:rotate(-90deg)}
.mark .disc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;line-height:1}
.mark .disc.paid{background:var(--pos);color:var(--paper);box-shadow:0 0 0 3px var(--pos-soft)}
.mark .disc.wait{background:var(--surface-3);color:var(--ink-3)}
.mark .disc.manual{background:transparent;border:2px solid var(--pos);color:var(--pos)}
.mark .disc.sched{background:var(--surface-3);color:var(--info)}
.mark .disc.sched-over{background:var(--neg);color:var(--paper)}
.mark .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.mark .dot.in{background:var(--pos)}

/* File rail ---------------------------------------------------------------
   Files are actions, not payment state. Keep them neutral and subordinate to
   the 26px status mark and the amount column. The keycap is part of the control
   (not a floating notification badge), which makes the fixed g1/g2/g3 mapping
   obvious without turning each file into a tiny card-inside-a-card. */
.fbadges{display:flex;gap:6px;align-items:center;margin-right:18px;min-width:0}
.fbadge{height:26px;min-width:34px;max-width:112px;display:inline-flex;align-items:center;gap:6px;
  padding:0 7px 0 5px;border-radius:7px;background:transparent;border:1px solid var(--line-2);
  color:var(--ink-2);cursor:pointer;line-height:1;white-space:nowrap;overflow:hidden;
  transition:border-color .12s ease,background .12s ease,color .12s ease,max-width .16s ease}
.fbadge:hover,.fbadge:focus-visible{border-color:var(--accent-line);background:var(--surface);color:var(--ink)}
.fbadge kbd{flex:none;font-size:9px;line-height:1.25;padding:1px 4px;border-radius:4px;
  border-bottom-width:2px;background:var(--surface-2);pointer-events:none}
.fbadge .ficon{width:14px;height:14px;display:block;flex:none;pointer-events:none}
.fbadge .ficon svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fbadge .flabel{max-width:0;opacity:0;overflow:hidden;font-family:var(--mono);font-size:9.5px;
  color:var(--ink-3);transition:max-width .16s ease,opacity .12s ease}
.row.focus .fbadge{max-width:112px}
.row.focus .fbadge .flabel{max-width:72px;opacity:1}
.row.focus .fbadge:hover .flabel{color:var(--ink-2)}

.name{min-width:0}
.name b{font-weight:600;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;gap:7px;align-items:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.name .meta .rec{color:var(--accent)}
.lock{color:var(--info)}

.amt{text-align:right;white-space:nowrap}
.amt .v{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.amt .v.in{color:var(--pos)}
.amt .d{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;margin-top:1px}
.amt .d.up{color:var(--neg)}
.amt .d.down{color:var(--pos)}
.amt .d.flat{color:var(--ink-3)}

/* ============ fold groups (:group bucket) ============ */
.fgroup{margin:0 0 3px}
.fhead{display:grid;grid-template-columns:14px 1fr auto auto;gap:9px;align-items:center;
  padding:8px 12px;margin:0 10px;border-radius:var(--r);background:var(--surface-3);
  border:1px solid var(--line-2);cursor:pointer;user-select:none}
.fhead:hover{border-color:var(--accent-line)}
.fchev{font-size:11px;color:var(--accent);transition:transform .14s;transform:rotate(90deg);line-height:1}
.fgroup.closed .fchev{transform:rotate(0deg)}
.fgroup.closed .frows{display:none}
.fname{font-weight:600;font-size:12.5px}
.fname.unc{color:var(--ink-3);font-weight:500;font-style:italic}
.fcount{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.fsum{font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}

/* skeleton + error rows */
.sk-bar{height:9px;border-radius:4px;background:var(--skeleton);background-size:220% 100%;
  animation:sh 1.15s linear infinite}
.sk-disc{width:26px;height:26px;border-radius:50%;background:var(--skeleton);background-size:220% 100%;animation:sh 1.15s linear infinite}
@keyframes sh{from{background-position:110% 0}to{background-position:-110% 0}}
.row.err .entry{background:var(--neg-soft);border-color:var(--neg)}
.retry{font-family:var(--mono);font-size:11px;background:var(--neg);color:var(--paper);border:none;
  border-radius:6px;padding:4px 9px;cursor:pointer}
.errtxt{display:block;font-size:12.5px;color:var(--neg);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.errsub{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:1px}

/* tooltip */
.tip{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line-2);
  border-radius:8px;box-shadow:var(--shadow-md);padding:9px 11px;font-family:var(--mono);font-size:11.5px;
  color:var(--ink-2);pointer-events:none;max-width:290px;line-height:1.65}
.tip b{color:var(--ink);font-weight:500}
.tip .hr{height:1px;background:var(--line);margin:6px 0}

/* ============ statusline ============ */
.status{display:flex;align-items:center;gap:0;background:var(--surface-2);
  border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;min-height:30px}
.st{padding:6px 11px;color:var(--ink-2);border-right:1px solid var(--line);white-space:nowrap}
.st.mode{background:var(--accent);color:var(--paper);font-weight:700;letter-spacing:.1em}
.st.mode.cmd{background:var(--info);color:var(--paper)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px;
  box-shadow:inset 0 -1.5px 0 var(--accent-line)}
.row.focus mark{background:var(--accent);color:var(--paper);box-shadow:none}
.row.match .entry{box-shadow:inset 0 0 0 1px var(--accent-line)}
.row.focus.match .entry{box-shadow:none}
.st.mode.vis{background:var(--pos);color:var(--paper)}
.st.grow{flex:1;border-right:none;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.st.msg{color:var(--accent)}
.st.msg.bad{color:var(--neg)}
.st.right{border-right:none;border-left:1px solid var(--line)}
.st.buf{color:var(--accent);font-weight:700;min-width:44px;text-align:right}

.cmdbar{display:none;align-items:center;gap:0;border-top:1px solid var(--accent-line);background:var(--surface)}
.cmdbar.on{display:flex}
.cmdbar .pfx{font-family:var(--mono);font-size:13px;color:var(--accent);padding:0 4px 0 12px}
.cmdbar input{flex:1;border:none;background:transparent;font-family:var(--mono);font-size:13px;
  color:var(--ink);padding:9px 12px 9px 0}
.cmdbar input:focus{outline:none}
.cmdhint{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding-right:12px;white-space:nowrap}

/* ============ modal ============ */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.42);backdrop-filter:blur(2px);
  display:none;place-items:center;z-index:100;padding:20px}
.scrim.on{display:grid}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:13px;
  box-shadow:var(--shadow-md);width:min(560px,100%);max-height:86vh;overflow:auto}
.modal h3{font-size:15px;font-weight:600;padding:14px 16px 0}
.modal .msub{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding:2px 16px 0}
.modal .mbody{padding:14px 16px}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;
  border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 12px 12px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:13px;border-radius:7px;padding:7px 13px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent-line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
.btn.dgr{background:var(--neg);border-color:var(--neg);color:var(--paper);font-weight:600}
.btn kbd{background:rgba(255,255,255,.18);border-color:transparent;color:inherit;margin-left:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:11px}
label.f{display:block}
label.f .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
input.i,select.i{width:100%;font-family:var(--mono);font-size:13px;background:var(--paper);color:var(--ink);
  border:1px solid var(--line-2);border-radius:7px;padding:7px 9px}
input.i:focus,select.i:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* the currency symbol sits outside the editable text on purpose — the
   masked amount field's value is always a pure number, never a string
   with a symbol baked in, so there's nothing to strip back out on save. */
.amtfield{position:relative}
.amtfield .cur{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:13px;color:var(--ink-3);pointer-events:none}
.amtfield input.i{padding-left:30px}
.warnbox{background:var(--neg-soft);border:1px solid var(--neg);border-radius:8px;padding:10px 12px;
  font-size:13px;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.warnbox .g{font-size:16px;line-height:1.2}
.notebox{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;
  padding:9px 11px;font-size:12.5px;color:var(--ink-2);margin-top:12px}

/* ============ keymap ============ */
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.kgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kgroup h4{margin:0 0 9px;font-size:11px;font-family:var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3)}
/* the key column sizes to the longest key in its own group, so a long command
   like `:add 50 mercado publix` can't overflow its box onto the description */
.krow{display:grid;grid-template-columns:minmax(64px,max-content) 1fr;gap:14px;
  padding:5px 0;align-items:baseline;font-size:12.5px}
.krow kbd{justify-self:start;max-width:100%;overflow-wrap:anywhere;white-space:normal}
.krow + .krow{border-top:1px solid var(--line)}
.krow .d{color:var(--ink-2)}

/* ===================================================================
   Full-viewport app shell — no prose, no documentation sections.
   The ledger is the page.
   =================================================================== */
html,body{height:100%}
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--paper)}
.appmark{font-family:var(--mono);font-weight:700;font-size:13.5px;line-height:1;letter-spacing:.16em;
  color:var(--accent);border:1px solid var(--accent-line);border-radius:7px;background:var(--accent-soft);
  height:38px;min-width:54px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 9px 0 11px;flex:none;user-select:none}
.app{flex:1;min-height:0;display:flex;flex-direction:column;margin:0;
  border:none;border-radius:0;box-shadow:none;background:var(--paper)}
.app.armed{border:none}
.topbar{flex:none;border-radius:0}
.topbar .tbtn{height:34px}

/* --- stage: [config vsplit] + panes --- */
.app{--gap:16px}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr;
  gap:var(--gap);padding:var(--gap);background:var(--paper)}
.app.cfgopen .stage{grid-template-columns:minmax(280px,352px) 1fr}
.panels{flex:none;min-height:0;min-width:0;display:grid;justify-content:center;
  grid-template-columns:repeat(2,minmax(0,var(--pane-max,1fr)));
  gap:var(--gap);padding:0;background:transparent}

/* gapped panes, unfocused pane recedes */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  opacity:.46;filter:saturate(.5);
  transition:opacity .22s ease,filter .22s ease,border-color .22s ease,box-shadow .22s ease}
.panel:last-child{border-right:1px solid var(--line)}
.panel:hover{opacity:.78;filter:saturate(.85)}
.panel.active,.panel.active:hover{opacity:1;filter:none;
  border-color:var(--accent-line);box-shadow:var(--shadow-md)}
.panel::before{display:none}
.p-head{flex:none;background:var(--surface-2)}
.ledger{flex:1;min-height:0;max-height:none;padding:7px 0 10px}
.status{flex:none;border-radius:0}
.cmdbar{flex:none}

/* --- tabs mode: one pane at a time --- */
.tabbar{display:none;align-items:center;gap:8px;flex:none;
  padding:calc(var(--gap) - 2px) var(--gap) 0;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.app.tabs .tabbar{display:flex}
/* one pane on a wide screen shouldn't stretch a row across 1400px */
.app.tabs .panels{grid-template-columns:minmax(0,var(--pane-max,1fr))}
.app.tabs .panel{opacity:1;filter:none}
.app.tabs .panel:not(.active){display:none}
.app.tabs .p-key{display:none}
.tab{display:flex;align-items:center;gap:10px;flex:none;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:7px 13px 7px 9px;color:var(--ink-3);font-family:var(--sans);
  transition:background .15s,border-color .15s,color .15s}
.tab:hover{border-color:var(--line-2);color:var(--ink-2)}
.tab .idx{font-family:var(--mono);font-size:10px;line-height:1;padding:3px 5px;border-radius:4px;
  background:var(--surface-3);color:var(--ink-3)}
.tab .nm{font-size:13.5px;font-weight:600}
.tab .bal{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.85}
.tab.on{background:var(--surface);border-color:var(--accent);color:var(--ink);
  box-shadow:0 0 0 3px var(--accent-soft)}
.tab.on .idx{background:var(--accent);color:var(--paper);font-weight:700}
.tabbar .hint{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  white-space:nowrap;padding-left:10px}

/* --- config vertical split --- */
.cfgpane{display:none;flex-direction:column;min-height:0;min-width:0;overflow:hidden;
  background:var(--surface);border:1px solid var(--line-2);border-radius:13px}
.app.cfgopen .cfgpane{display:flex}
.cfg-h{display:flex;align-items:center;gap:9px;flex:none;padding:9px 12px;

.cfg-h b{font-family:var(--mono);font-size:12.5px;font-weight:700}
.cfg-h .path{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);

.cfg-h button{margin-left:auto;flex:none;font-family:var(--mono);font-size:10.5px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line-2);border-radius:5px;
  padding:2px 7px;color:var(--ink-2)}
.cfg-h button:hover{border-color:var(--accent-line);color:var(--ink)}
.cfg-body{flex:1;min-height:0;display:grid;grid-template-columns:36px 1fr;overflow:hidden}
.cfg-gut{overflow:hidden;text-align:right;padding:10px 7px 10px 0;background:var(--surface-2);
  border-right:1px solid var(--line);font-family:var(--mono);font-size:11.5px;line-height:1.65;
  color:var(--ink-3);font-variant-numeric:tabular-nums;user-select:none;white-space:pre}
.cfg-gut b{color:var(--neg);font-weight:700}
.cfg-body textarea{border:none;resize:none;background:transparent;color:var(--ink);
  font-family:var(--mono);font-size:11.5px;line-height:1.65;padding:10px 12px 10px 10px;
  tab-size:2;white-space:pre;overflow-wrap:normal;overflow:auto}
.cfg-body textarea:focus{outline:none}
.cfg-st{flex:none;font-family:var(--mono);font-size:10.5px;line-height:1.55;padding:7px 12px;
  border-top:1px solid var(--line);background:var(--surface-2);color:var(--pos)}
.cfg-st.bad{color:var(--neg)}
.cfg-st .d{color:var(--ink-3)}

@media (max-width:700px){
  .fbadges{margin-right:10px;gap:4px}
  .fbadge{min-width:30px;padding:0 5px}
  .row.focus .fbadge .flabel{max-width:0;opacity:0}
  /* keep the top bar on one row: the month picker replaces the arrows,
     and the server pill keeps its dot but loses its label */
  #prevM,#nextM{display:none}
  #netTxt{display:none}
  .netdot{padding:7px 9px}
  .mpick .month{min-width:86px;font-size:15px}
  .tabbar{padding-top:12px}
  .tabbar .hint{display:none}   /* the balance stays — it is the only view of the other pane */
}
@media (max-width:860px){
  .topbar{min-height:0;gap:10px;padding:11px 12px}
  .hh{display:none}
  .topbar .spacer{flex:1}
  #themeTxt{display:none}
  .appmark{height:34px;min-width:46px}
  .app.cfgopen .stage{grid-template-columns:1fr}
  .app.cfgopen .panels{display:none}
}
@media (prefers-reduced-motion:reduce){ .panel,.tab{transition:none} }

/* ================= helpers ================= */
const $ = s => document.querySelector(s);

/* Currency is household-wide, admin-only config (ffm.toml's [locale] table,
   simulated here as CFG.currency) — never a per-member preference. Every
   member's transactions land in the same shared totals, so letting members
   pick different currencies would mean either fake, unbacked "conversion"
   or two different-looking numbers claiming to be the same total. One
   value, same tier as storage/layout, is what keeps that coherent. This
   table is the single source every money format and the edit-modal's
   amount mask both read from — change CFG.currency and both follow, with
   nothing hardcoded to Brazilian formatting left behind. */
const CURRENCIES = {
  BRL: { symbol:'R$', decimals:2, dec:',', grp:'.' },
  USD: { symbol:'$',  decimals:2, dec:'.', grp:',' },
  EUR: { symbol:'€',  decimals:2, dec:',', grp:'.' },
  GBP: { symbol:'£',  decimals:2, dec:'.', grp:',' }
};
const curFmt = () => CURRENCIES[CFG.currency] || CURRENCIES.BRL;
const groupThousands = (intStr, grp) => intStr.replace(/\B(?=(\d{3})+(?!\d))/g, grp);
/* cents (or whatever the currency's smallest unit is) → a display string,
   using that currency's own decimal/grouping separators — not always a dot
   and a comma the way pt-BR formatting alone would assume. */
function minorUnitsToDisplay(units, f){
  const neg = units < 0; units = Math.abs(units);
  const div = Math.pow(10, f.decimals);
  const intPart = Math.floor(units / div).toString();
  const fracPart = f.decimals ? f.dec + (units % div).toString().padStart(f.decimals, '0') : '';
  return (neg ? '-' : '') + groupThousands(intPart, f.grp) + fracPart;
}
const fmtMoney = n => {
  const f = curFmt();
  return f.symbol + ' ' + minorUnitsToDisplay(Math.round(Math.abs(n) * Math.pow(10, f.decimals)), f);
};
/* The "no amount yet" placeholder (R$ __,__) is itself a money format, so it
   has to follow the same currency swap as everything else — a USD symbol
   next to a comma-decimal blank would be exactly the kind of half-dynamic
   inconsistency this currency setting is supposed to rule out everywhere. */
const emptyAmountPlaceholder = () => { const f = curFmt(); return f.symbol + ' __' + f.dec + '__'; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---- the rest of 2026, materialized from the same recurring rules ---- */
const TODAY_M = 8, TODAY_D = 7;            // 07/09/2026
const slug = s => s.split(' · ')[0].toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_');

const RULES = [[

function makeMonth(mi){
  let s = (mi + 1) * 7919;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const mm = String(mi + 1).padStart(2, '0');
  const future = mi > TODAY_M, now = mi === TODAY_M;
  return RULES.map(list => list.filter(r => !r.months || r.months.includes(mi)).map(r => {
    if(r.kind === 'in') return T({kind:'in', status:'in', title:r.title, amount:r.amount, day:r.day});
    const amount = +(r.base * (1 + (rnd()*2 - 1) * r.v)).toFixed(2);
    const title = r.title.replace('{n}', mi + 1);
    const settled = !future && (!now || r.day <= TODAY_D);
    if(r.track){
      const due = String(r.due).padStart(2,'0') + '/' + mm + '/2026';
      if(settled) return T({title, key:r.key, bucket:r.bucket, amount, day:r.day, status:'paid', recurring:true,
        tracked:true, due, pattern:slug(r.title) + '/2026/' + mm + '.pdf'});
      const span = future ? .04 : Math.max(.08, Math.min(.97, TODAY_D / r.due));
      return T({title, key:r.key, bucket:r.bucket, amount:0, day:0, status:'pending', progress:span, recurring:true,
        tracked:true, due, pattern:slug(r.title) + '/2026/' + mm + '_scheduled.pdf'});
    }
    if(future && !r.rec) return null;                 // variable spends aren't projected
    if(now && r.day > TODAY_D && !r.rec) return null;
    return T({title, key:r.key, bucket:r.bucket, amount:future ? amount : amount, day:r.day, recurring:!!r.rec});
  }).filter(Boolean));
}

const MONTHS = Array.from({length:12}, (_, mi) => ({
  key: String(mi+1).padStart(2,'0') + '/2026',
  label: MN[mi] + ' / 2026',
  future: mi > TODAY_M,
  now: mi === TODAY_M,
  m: AUTHORED[mi] || makeMonth(mi)
}));

/* file badges are derived from the tracked row's existing pattern + status —
   barcode/scheduled/receipt are three independent files per period, and a
   row never carries both scheduled and receipt: uploading the receipt
   supersedes and removes the scheduled file, per the spec. */
MONTHS.forEach(M => M.m.forEach(rows => rows.forEach(t => {
  if(!t.tracked || !t.pattern) return;
  const base = t.pattern.replace(/(_scheduled)?\.pdf$/, '');
  t.barcodePath = base + '_barcode.pdf';
  if(t.status === 'paid') t.receiptPath = base + '.pdf';
  else if(t.status === 'scheduled' || t.status === 'scheduled-overdue') t.scheduledPath = base + '_scheduled.pdf';
  // status === 'pending' → bill on file, nothing scheduled or paid yet
})));

/* month-over-month deltas are derived, not authored — the same window the app would run */
const mkey = t => t.key || t.title;
MONTHS.forEach((M, i) => {
  if(i === 0) return;
  M.m.forEach((rows, p) => rows.forEach(t => {
    if(t.kind === 'in' || t.status === 'pending' || !t.amount) { t.delta = null; return; }
    const prev = MONTHS[i-1].m[p].find(x => mkey(x) === mkey(t) && x.amount);
    t.delta = prev ? Math.round((t.amount - prev.amount) / prev.amount * 100) : null;
  }));
});

  { name:'Rodrigo', role:'admin', key:'H' },
  { name:'Ana',     role:null,    key:'L' }

/* ================= state ================= */
const S = {
  mi: TODAY_M, panel: 0, focus: [1,1], nu: 'rnu', online: true, cfg: false,
  sel: [new Set(), new Set()], undo: [], msg:'', msgBad:false,
  buf:'', count:'', mode:'NORMAL',
  q:'', qre:null, origin:{panel:0, focus:0},
  foldClosed: [new Set(), new Set()],   // per-panel set of closed bucket names, :group bucket
  /* The logged-in member is always MEMBERS[0] (Rodrigo) in this mock — there
     is only ever one real session. previewNonAdmin doesn't change *who* is
     logged in, only whether their admin rights are currently in effect —
     "preview my own experience with them switched off", not "become someone
     else". See isAdminNow() and isPrivacyHidden() below. */
  previewNonAdmin: false
};
/* The one thing this toggle actually changes: whether the logged-in member
   (always MEMBERS[0]) currently has admin rights in effect. Never a stand-in
   for "who is logged in" — that stays Rodrigo either way. */
function isAdminNow(){ return MEMBERS[0].role === 'admin' && !S.previewNonAdmin; }
/* A private row is hidden from other members but never from its own owner
   or the admin — this is the one rule that actually changes visible
   behaviour when admin rights are switched off in preview. Rodrigo's own
   pane (p===0) is never affected: owning a row already grants visibility,
   independent of role. */
function isPrivacyHidden(p, t){ return !!(t && t.private && p !== 0 && !isAdminNow()); }
function togglePreview(){
  S.previewNonAdmin = !S.previewNonAdmin;
  clampFocusToVisible(0); clampFocusToVisible(1);
  render();
  say(S.previewNonAdmin
    ? 'previewing as a non-admin member · other members’ private rows and admin-only config are hidden'
    : 'admin rights restored');
}

/* ================= search =================
   `/` searches the ledger — the rows in view for the current month. It is not
   the command bar (that is `:`), and it is not a query across every month;
   that would be a different verb (`:grep`). */
function hay(t){
  return [t.title, t.day ? pad(t.day) + '/' + MONTHS[S.mi].key : '', t.due || '',
          fmtMoney(t.amount), t.private ? 'private' : '',
          t.recurring ? 'recurring' : '', t.status].join(' ');
}
function setQuery(q){
  S.q = q;
  if(!q){ S.qre = null; return; }
  try { S.qre = new RegExp(q, 'i'); }                       // vim-ish: the term is a regex
  catch(err) { S.qre = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'); }
}
function hl(s){
  const t = esc(s);
  if(!S.qre) return t;
  try { return t.replace(new RegExp(S.qre.source, 'ig'), m => '<mark>' + m + '</mark>'); }
  catch(err) { return t; }
}
function isMatch(t){ return !!(S.qre && S.qre.test(hay(t))); }

function matchesOf(){
  if(!S.qre) return [];
  const panes = CFG.search_scope === 'household' ? MEMBERS.map((_,i) => i) : [S.panel];
  const out = [];
  panes.forEach(p => view(p).forEach((t, i) => { if(isMatch(t)) out.push({p, i, id:t.id}); }));
  return out;
}
function firstFrom(ms, p, i){
  return ms.find(m => m.p > p || (m.p === p && m.i >= i)) || ms[0];
}
function jumpMatch(dir){
  if(!S.qre){ say('no search — press / first', true); return; }
  const ms = matchesOf();
  if(!ms.length){ say('E486: pattern not found · /' + S.q, true); return; }
  const at = ms.findIndex(m => m.p === S.panel && m.i === S.focus[S.panel]);
  const k = at < 0 ? (dir > 0 ? 0 : ms.length - 1) : (at + dir + ms.length) % ms.length;
  const wrapped = at >= 0 && ((dir > 0 && k === 0) || (dir < 0 && k === ms.length - 1));
  S.panel = ms[k].p; S.focus[ms[k].p] = ms[k].i;
  render();
  say('/' + S.q + ' · ' + (k + 1) + '/' + ms.length
    + (wrapped ? (dir > 0 ? ' · wrapped to top' : ' · wrapped to bottom') : ''));
}
function liveSearch(q){
  setQuery(q);
  const ms = matchesOf();
  if(ms.length){
    const m = firstFrom(ms, S.origin.panel, S.origin.focus);
    S.panel = m.p; S.focus[m.p] = m.i;
  } else {
    S.panel = S.origin.panel;
    S.focus[S.panel] = Math.min(S.origin.focus, view(S.panel).length - 1);
  }
  render();
  $('#cmdHint').textContent = !q ? 'regex ok · Enter keeps it · Esc cancels'
    : (ms.length ? ms.length + ' match' + (ms.length > 1 ? 'es' : '')
        + (CFG.search_scope === 'household' ? ' · household' : ' · this pane')
        : 'no match');
}
function clearSearch(){
  const had = !!S.q;
  setQuery('');
  return had;
}
const rowsOf = p => MONTHS[S.mi].m[p];
/* rowsOf = stored order (what J/K mutates). view = what the ledger draws.
   They are the same array only while ledger.sort is "manual" — which is exactly
   why reordering is refused under a computed sort. */
function view(p){
  const rs = rowsOf(p);
  if(CFG.sort === 'manual') return rs;
  const c = rs.slice();
  /* an unpaid row has no paid-on day yet, so it sorts by the day it falls due */
  const day = t => t.day || (t.due ? parseInt(t.due, 10) : 0) || 99;
  if(CFG.sort === 'date') c.sort((a,b) => day(a) - day(b));
  if(CFG.sort === 'amount') c.sort((a,b) => b.amount - a.amount);
  return c;
}
const cur = () => view(S.panel)[S.focus[S.panel]];

/* ================= grouping · :group bucket =================
   Grouping never reorders the underlying array or the index space focus/gutter
   rely on — it only changes how view(p) gets drawn. rowHTML still receives the
   row's real index into view(p), so click-to-focus, the gutter and selection
   all keep working unchanged; only the rendered position moves. */
const bucketOf = t => t && t.kind !== 'in' ? (t.bucket || 'Uncategorized') : null;
function allBucketsOf(p){
  const s = new Set();
  view(p).forEach(t => { const b = bucketOf(t); if(b) s.add(b); });
  return [...s];
}
function isFoldedOut(p, i){
  const t = view(p)[i];
  /* Privacy-hidden rows are skipped by the exact same mechanism as a
     closed fold — the one thing that already knows how to keep move(),
     clampFocusToVisible() and the gutter's index math correct while
     stepping over rows a plain rows.filter() would otherwise renumber
     out from under S.focus. */
  if(isPrivacyHidden(p, t)) return true;
  if(CFG.group !== 'bucket') return false;
  const b = bucketOf(t);
  return !!b && S.foldClosed[p].has(b);
}
function clampFocusToVisible(p){
  const len = rowsOf(p).length;
  if(!len) return;
  let f = Math.min(Math.max(S.focus[p], 0), len - 1), guard = 0;
  while(isFoldedOut(p, f) && guard < len){ f = (f + 1) % len; guard++; }
  S.focus[p] = f;
}
function groupedHTML(p, fi){
  const rows = view(p);
  const ins = [], groups = new Map();
  rows.forEach((t, i) => {
    /* A privacy-hidden row skips both the flat list and grouping entirely —
       not just its row, but its bucket's count and subtotal too. Baking its
       amount into a subtotal a restricted viewer CAN see would leak its
       existence through arithmetic, which defeats the point of hiding it. */
    if(isPrivacyHidden(p, t)) return;
    const b = bucketOf(t);
    if(!b){ ins.push(rowHTML(t, i, fi, p)); return; }
    if(!groups.has(b)) groups.set(b, []);
    groups.get(b).push({t, i});
  });
  const order = [...groups.keys()].filter(b => b !== 'Uncategorized');
  if(groups.has('Uncategorized')) order.push('Uncategorized');
  return ins.join('') + order.map(b => {
    const items = groups.get(b);
    const sum = items.reduce((a, {t}) => a + (t.deleted ? 0 : t.amount), 0);
    const closed = S.foldClosed[p].has(b);
    return '<div class="fgroup' + (closed?' closed':'') + '">'
      + '<div class="fhead" data-p="' + p + '" data-b="' + esc(b) + '">'
      + '<span class="fchev">▸</span>'
      + '<span class="fname' + (b==='Uncategorized'?' unc':'') + '">' + esc(b) + '</span>'
      + '<span class="fcount">' + items.length + ' item' + (items.length>1?'s':'') + '</span>'
      + '<span class="fsum">' + fmtMoney(sum) + '</span></div>'
      + '<div class="frows">' + items.map(({t,i}) => rowHTML(t, i, fi, p)).join('') + '</div></div>';
  }).join('');
}

/* a deliberately small TOML subset: sections, scalars, comments.
   The comment stripper has to respect quotes, or a hex colour like "#c4a7e7"
   gets cut in half at its own `#`. */
function stripComment(s){
  let out = '', q = false;
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(c === '"') q = !q;
    else if(c === '#' && !q) break;
    out += c;
  }
  return out;
}
function parseToml(src){
  const data = {}, at = {}, errs = [];
  let sec = null;
  src.split('\n').forEach((raw, i) => {
    const ln = i + 1, line = stripComment(raw).trim();
    if(!line) return;
    let m = line.match(/^\[([A-Za-z0-9_]+)\]$/);
    if(m){ sec = m[1]; data[sec] = data[sec] || {}; return; }
    m = line.match(/^([A-Za-z0-9_]+)\s*=\s*(.+)$/);
    if(!m){ errs.push({ln, msg:'expected `key = value` or `[section]`'}); return; }
    if(!sec){ errs.push({ln, msg:'`' + m[1] + '` sits outside any [section]'}); return; }
    const k = m[1]; let v = m[2].trim();
    if(/^".*"$/.test(v)) v = v.slice(1, -1);
    else if(v === 'true') v = true;
    else if(v === 'false') v = false;
    else if(/^-?\d+$/.test(v)) v = +v;
    else { errs.push({ln, msg:'`' + k + '` — unquoted value ' + v}); return; }
    data[sec][k] = v; at[sec + '.' + k] = ln;
  });
  return { data, at, errs };
}

function readToml(src){
  const { data, at, errs } = parseToml(src);
  if(errs.length) return { err:errs[0] };
  const next = {}; let n = 0;
  for(const path in SCHEMA){
    const [s, k] = path.split('.'), rule = SCHEMA[path];
    if(!data[s] || !(k in data[s])) continue;
    const v = data[s][k], ln = at[path];
    if(Array.isArray(rule) && !rule.includes(v))
      return { err:{ln, msg:path + ' must be ' + rule.map(x=>'"'+x+'"').join(', ') + ' — got ' + JSON.stringify(v)} };
    if(rule === 'int' && typeof v !== 'number')
      return { err:{ln, msg:path + ' must be a number — got ' + JSON.stringify(v)} };
    if(rule === 'bool' && typeof v !== 'boolean')
      return { err:{ln, msg:path + ' must be true or false — got ' + JSON.stringify(v)} };
    next[k] = v; n++;
  }
  if(next.gap != null) next.gap = Math.max(0, Math.min(48, next.gap));
  if(next.min_split_width != null) next.min_split_width = Math.max(320, Math.min(2400, next.min_split_width));
  if(next.max_width != null) next.max_width = next.max_width === 0 ? 0 : Math.max(360, Math.min(2400, next.max_width));

  /* [theme] is open-ended: a name plus any token you want to override */
  const th = data.theme || {};
  next.theme = 'ffm'; next.theme_over = {};
  for(const k in th){
    const ln = at['theme.' + k], val = th[k];
    if(k === 'name'){
      if(!THEMES[val]) return { err:{ln, msg:'theme.name — unknown theme ' + JSON.stringify(val)
        + '. try: ' + THEME_NAMES.join(', ')} };
      next.theme = val; n++; continue;
    }
    if(!K.includes(k)) return { err:{ln, msg:'theme.' + k + ' is not a token. overridable: ' + K.join(', ')} };
    if(typeof val !== 'string' || !/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(val))
      return { err:{ln, msg:'theme.' + k + ' must be a hex colour like "#c4a7e7" — got ' + JSON.stringify(val)} };
    next.theme_over[k] = val; n++;
  }
  return { next, n };
}

function applyToml(src){
  const res = readToml(src);
  const st = $('#cfgSt');
  if(res.err){
    st.className = 'cfg-st bad';
    st.innerHTML = '✗ line ' + res.err.ln + ' · ' + esc(res.err.msg)
      + '<br><span class="d">running on the last valid config</span>';
    drawGut(res.err.ln);
    return false;
  }
  Object.assign(CFG, res.next);
  S.nu = NU[CFG.line_numbers] || 'rnu';
  applyTheme();
  const nOver = Object.keys(CFG.theme_over).length;
  st.className = 'cfg-st';
  st.innerHTML = '✓ ' + res.n + ' keys applied · theme ' + CFG.theme
    + (nOver ? ' +' + nOver + ' override' + (nOver>1?'s':'') : '')
    + '<br><span class="d">layout.panes = "' + CFG.panes + '" → ' + effLayout() + '</span>';
  drawGut();
  render();
  return true;
}

function effLayout(){
  if(CFG.panes === 'split' || CFG.panes === 'tabs') return CFG.panes;
  const taken = S.cfg ? 352 + CFG.gap * 3 : CFG.gap * 2;
  return (innerWidth - taken) >= CFG.min_split_width ? 'split' : 'tabs';
}

function drawGut(badLine){
  const ta = $('#cfgText'), g = $('#cfgGut');
  const n = ta.value.split('\n').length;
  let out = '';
  for(let i = 1; i <= n; i++) out += (i === badLine ? '<b>' + i + '</b>' : i) + '\n';
  g.innerHTML = out;
  g.scrollTop = ta.scrollTop;
}

/* `:set` and the statusline write back into the file, rather than holding a
   second copy of the setting. */
function writeBackKey(key, val, label){
  const ta = $('#cfgText');
  ta.value = ta.value.replace(new RegExp('^(\\s*' + key + '\\s*=\\s*).*$', 'm'), '$1"' + val + '"');
  drawGut();
  $('#cfgSt').className = 'cfg-st';
  $('#cfgSt').innerHTML = '✓ ' + label + ' = "' + val + '"'
    + '<br><span class="d">written back from the app</span>';
}
function writeBackLineNumbers(){
  CFG.line_numbers = NU_R[S.nu];
  writeBackKey('line_numbers', CFG.line_numbers, 'ledger.line_numbers');
}

function openCfg(){
  if(!isAdminNow()){ say('ffm.toml is admin-only', true); return; }
  S.cfg = true; render(); setTimeout(()=>{ $('#cfgText').focus(); drawGut(); }, 20);
}
function closeCfg(){ S.cfg = false; render(); $('#app').focus(); }

function gotoTab(dir){
  const n = S.count ? parseInt(S.count, 10) : 0;
  S.count = '';
  if(n) switchPanel(Math.max(0, Math.min(MEMBERS.length - 1, n - 1)));
  else switchPanel((S.panel + dir + MEMBERS.length) % MEMBERS.length);
}

/* ================= row markup ================= */
function markHTML(t){
  if(t.state === 'skeleton') return '<div class="mark"><div class="sk-disc"></div></div>';
  if(t.kind === 'in') return '<div class="mark"><span class="dot in"></span></div>';
  if(t.status === 'paid')
    return '<div class="mark"><div class="disc paid" aria-label="paid, receipt found">✓</div></div>';
  if(t.status === 'manual-paid')
    return '<div class="mark"><div class="disc manual" aria-label="marked paid manually, no file to prove it">✓</div></div>';
  if(t.status === 'pending'){
    const p = t.progress == null ? .5 : t.progress, C = 2*Math.PI*10.5;
    const col = p >= 1 ? 'var(--neg)' : p >= .66 ? 'var(--accent)' : 'var(--pos)';
    return '<div class="mark">'
      + '<svg viewBox="0 0 26 26" aria-hidden="true">'
      + '<circle cx="13" cy="13" r="10.5" fill="none" stroke="var(--line-2)" stroke-width="2.5"></circle>'
      + '<circle cx="13" cy="13" r="10.5" fill="none" stroke="' + col + '" stroke-width="2.5" stroke-linecap="round"'
      + ' stroke-dasharray="' + C + '" stroke-dashoffset="' + (C*(1-p)) + '"></circle></svg>'
      + '<div class="disc wait" style="width:17px;height:17px;font-size:10px">✓</div></div>';
  }
  if(t.status === 'scheduled' || t.status === 'scheduled-overdue'){
    const overdue = t.status === 'scheduled-overdue';
    const col = overdue ? 'var(--neg)' : 'var(--info)';
    const p = overdue ? 1 : (t.progress == null ? .5 : t.progress), C = 2*Math.PI*10.5;
    return '<div class="mark" aria-label="' + (overdue ? 'scheduled payment, due date passed, no receipt yet' : 'payment scheduled, not yet due') + '">'
      + '<svg viewBox="0 0 26 26" aria-hidden="true">'
      + '<circle cx="13" cy="13" r="10.5" fill="none" stroke="var(--line-2)" stroke-width="2.5"></circle>'
      + '<circle cx="13" cy="13" r="10.5" fill="none" stroke="' + col + '" stroke-width="2.5" stroke-linecap="round"'
      + ' stroke-dasharray="' + C + '" stroke-dashoffset="' + (C*(1-p)) + '"></circle></svg>'
      + '<div class="disc ' + (overdue ? 'sched-over' : 'sched') + '" style="width:17px;height:17px;font-size:9px">'
      + (overdue ? '!' : '◷') + '</div></div>';
  }
  return '<div class="mark"><span class="dot"></span></div>';
}

function metaHTML(t){
  const bits = [];
  if(t.status === 'paid') bits.push('<span>🏁 ' + pad(t.day) + '/' + MONTHS[S.mi].key + '</span>');
  else if(t.status === 'manual-paid') bits.push('<span style="color:var(--pos)">✓ marcado como pago (sem comprovante)</span>');
  else if(t.status === 'scheduled') bits.push('<span style="color:var(--info)">◷ agendado · vence ' + t.due + '</span>');
  else if(t.status === 'scheduled-overdue') bits.push('<span style="color:var(--neg)">⚠ agendado, sem comprovante · venceu ' + t.due + '</span>');
  else if(t.status === 'pending') bits.push('<span class="rec">◷ vence ' + t.due + '</span>');
  else if(t.day) bits.push('<span>' + pad(t.day) + '/' + MONTHS[S.mi].key + '</span>');
  if(t.totalInstallments) bits.push('<span style="color:var(--ink-2)">' + (t.installmentsPaid||0) + '/' + t.totalInstallments + '</span>');
  if(t.recurring && !['pending','scheduled','scheduled-overdue'].includes(t.status) && CFG.show_recurring) bits.push('<span class="rec">↻</span>');
  if(t.private) bits.push('<span class="lock" title="hidden from other members">🔒 private</span>');
  if(t.deleted) bits.push('<span style="color:var(--neg)">deleted</span>');
  if(t.restored) bits.push('<span style="color:var(--info)" title="supersedes the deleted row">↩ #' + t.restored + '</span>');
  return bits.join('');
}
const pad = n => String(n).padStart(2,'0');

/* ================= file badges =================

   renumbered by what happens to exist on a given row, which is what makes

const FILE_KINDS = [

  return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8v11l-2-1-2 1-2-1-2 1z"/><path d="M6 6.2h4M6 8.5h4M6.3 10.8l1 1 2.4-2.5"/></svg>';

function fileBadgesHTML(t, p, i){

function deltaHTML(t){

function entryHTML(t, p, i){

function gutter(i, fi){
  if(S.nu === 'nonu') return '';
  if(S.nu === 'nu') return String(i+1);
  return i === fi ? '0' : String(Math.abs(i - fi));
}

function rowHTML(t, i, fi, p){
  const cls = ['row'];
  if(i === fi && p === S.panel) cls.push('focus');
  if(S.sel[p].has(t.id)) cls.push('sel');
  if(t.deleted) cls.push('deleted');
  if(t.state === 'error') cls.push('err');
  if(isMatch(t)) cls.push('match');
  if(S.nu === 'nonu') cls.push('nogut');
  return '<div class="' + cls.join(' ') + '" data-p="' + p + '" data-i="' + i + '" data-id="' + t.id + '">'
    + '<div class="gut">' + gutter(i, fi) + '</div>' + entryHTML(t, p, i) + '</div>';
}

/* ================= render ================= */
function totals(p){
  /* Excluding a privacy-hidden row here, not just from the row list, is what
     keeps a restricted viewer's numbers internally consistent — pane totals,
     the tab-bar balance and the household header all read from this one
     function, so there's nowhere left for a hidden row's amount to leak
     through as an unexplained gap between what's shown and what's listed. */
  const rs = rowsOf(p).filter(t => !t.deleted && t.state === 'ok' && !isPrivacyHidden(p, t));
  const i = rs.filter(t=>t.kind==='in').reduce((a,b)=>a+b.amount,0);
  const o = rs.filter(t=>t.kind==='out').reduce((a,b)=>a+b.amount,0);
  return {i,o,b:i-o};
}

function render(){
  const M = MONTHS[S.mi];

  app.style.setProperty('--gap', CFG.gap + 'px');

  $('#cfgBtn').hidden = !isAdminNow();

  $('#tabbar').innerHTML = lay !== 'tabs' ? '' : MEMBERS.map((mem,p) => {

      + '<span class="idx">' + (p+1) + '</span><span class="nm">' + mem.name + '</span>'
      + '<span class="bal">' + (t.b<0?'− ':'') + fmtMoney(t.b) + '</span></button>';
  }).join('') + '<span class="hint">gt · gT</span>';
  $('#panels').innerHTML = MEMBERS.map((mem,p) => {
    const t = totals(p), fi = S.focus[p];
    return '<div class="panel' + (p===S.panel?' active':'') + '" data-panel="' + p + '">'
      + '<div class="p-head"><div class="p-title">'

      + (mem.role ? '<span class="p-role' + (isAdminNow() ? '' : ' preview') + '" data-role-toggle'
          + ' title="' + (isAdminNow() ? 'Preview as a non-admin member' : 'Return to admin') + '">'
          + (isAdminNow() ? mem.role : 'preview') + '</span>' : '')
      + '<span class="p-key">' + (p===0?'H':'L') + '</span></div>'
      + '<div class="sums">'
      + '<div class="sum in"><div class="k">INs</div><div class="v">' + fmtMoney(t.i) + '</div></div>'
      + '<div class="sum out"><div class="k">OUTs</div><div class="v">' + fmtMoney(t.o) + '</div></div>'
      + '<div class="sum bal"><div class="k">Balance</div><div class="v' + (t.b<0?' neg':'') + '">'
      + (t.b<0?'− ':'') + fmtMoney(t.b) + '</div></div>'
      + '</div></div>'

  }).join('');

  const a = totals(0), b = totals(1);

  $('#hOut').textContent = fmtMoney(a.o+b.o);
  const net = a.b+b.b;
  $('#hNet').textContent = (net<0?'− ':'') + fmtMoney(net);
  $('#hNet').style.color = net<0 ? 'var(--neg)' : 'var(--ink)';

     rules): Rodrigo stays logged in, with his own role in effect, even
     while H/L has him looking at Ana's pane. This used to read
     MEMBERS[S.panel], which meant the statusline's "(admin)" silently

  $('#stMember').textContent = MEMBERS[0].name + (isAdminNow() ? ' (admin)' : ' (previewing as member)');
  $('#stPos').textContent = (S.focus[S.panel]+1) + '/' + rowsOf(S.panel).length;
  $('#stNu').textContent = S.nu;

  $('#stSort').style.color = CFG.sort === 'manual' ? '' : 'var(--info)';
  $('#stBuf').textContent = S.count + S.buf;
  $('#stMode').textContent = S.mode;
  $('#stMode').className = 'st mode' + (S.mode!=='NORMAL' ? ' cmd' : '');

    || (nsel ? nsel + ' row' + (nsel>1?'s':'') + ' selected' : '')
    || (S.q ? '/' + S.q + ' · ' + nq + ' match' + (nq===1?'':'es') + ' · Esc clears' : '');

function say(m, bad){ S.msg = m; S.msgBad = !!bad; render();
  clearTimeout(say._t); say._t = setTimeout(()=>{ S.msg=''; S.msgBad=false; render(); }, 3200); }

/* ================= actions ================= */
/* ---- reorder: J / K ----
   One swap pass per step, from the trailing edge, skipping neighbours that are
   themselves selected. Gaps in a scattered selection are preserved, and a row
   pinned at the boundary simply holds while the others move. */
function reorderStep(dir, ids){
  const list = rowsOf(S.panel);
  let did = false;
  if(dir === 1){
    for(let i = list.length - 2; i >= 0; i--)
      if(ids.has(list[i].id) && !ids.has(list[i+1].id)){
        [list[i], list[i+1]] = [list[i+1], list[i]]; did = true;
      }
  } else {
    for(let i = 1; i < list.length; i++)
      if(ids.has(list[i].id) && !ids.has(list[i-1].id)){
        [list[i], list[i-1]] = [list[i-1], list[i]]; did = true;
      }
  }
  return did;
}

/* FLIP: measure, mutate, invert, release — so a moved row reads as travelling
   rather than teleporting. */
function flip(mutate){
  const before = new Map();
  document.querySelectorAll('.panel .row').forEach(r =>
    before.set(r.dataset.id, r.getBoundingClientRect().top));
  mutate();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.panel .row').forEach(r => {
    const b = before.get(r.dataset.id);
    if(b == null) return;
    const d = b - r.getBoundingClientRect().top;
    if(!d) return;
    r.style.transition = 'none';
    r.style.transform = 'translateY(' + d + 'px)';
    requestAnimationFrame(() => {
      r.style.transition = 'transform .19s cubic-bezier(.2,.75,.3,1)';
      r.style.transform = '';
    });
  });
}

function moveRows(dir){
  if(CFG.group !== 'none'){
    S.count = '';
    say('ledger.group = "' + CFG.group + '" — reorder needs group = "none"', true);
    return;
  }
  if(CFG.sort !== 'manual'){
    S.count = '';
    say('ledger.sort = "' + CFG.sort + '" — reorder needs sort = "manual"', true);
    return;
  }
  const list = rowsOf(S.panel), sel = S.sel[S.panel], focused = cur();
  if(!focused) return;
  const ids = sel.size ? new Set(sel) : new Set([focused.id]);
  const n = Math.max(1, parseInt(S.count || '1', 10));
  S.count = '';
  const snapshot = list.map(t => t.id);
  let steps = 0;
  for(let i = 0; i < n; i++){ if(!reorderStep(dir, ids)) break; steps++; }
  if(!steps){ render(); say(dir === 1 ? 'already at the bottom' : 'already at the top', true); return; }
  S.undo.push({ k:'reorder', p:S.panel, order:snapshot });
  flip(() => {
    S.focus[S.panel] = Math.max(0, list.findIndex(t => t.id === focused.id));
    render();
  });
  say((ids.size > 1 ? ids.size + ' rows' : '“' + focused.title + '”') + ' moved '
    + (steps > 1 ? steps + ' ' : '') + (dir === 1 ? 'down' : 'up'));
}

/* ---- re-attribute: Ctrl-H / Ctrl-L, or :move <member> ----
   Not a reorder. Moving a row across panes changes who the transaction belongs
   to, which moves money between two people's totals — so it snapshots both
   ledgers for undo, and asks first when the row is private (its owner would
   lose sight of it). */
let pendingSend = null;

function doSend(target){
  const src = rowsOf(S.panel), dst = rowsOf(target);
  const sel = S.sel[S.panel], focused = cur();
  const rows = sel.size ? src.filter(t => sel.has(t.id)) : (focused ? [focused] : []);
  if(!rows.length) return;
  S.undo.push({ k:'reattr', a:S.panel, b:target, snapA:src.slice(), snapB:dst.slice() });
  rows.forEach(t => {
    src.splice(src.indexOf(t), 1);
    dst.push(t);
  });
  S.sel[S.panel] = new Set();
  const from = MEMBERS[S.panel].name, to = MEMBERS[target].name;
  flip(() => {
    S.panel = target;
    S.focus[target] = Math.max(0, view(target).findIndex(t => t.id === rows[0].id));
    S.focus[1 - target] = Math.max(0, Math.min(S.focus[1 - target], rowsOf(1 - target).length - 1));
    render();
  });
  say((rows.length > 1 ? rows.length + ' rows' : '“' + rows[0].title + '”')
    + ' · ' + from + ' → ' + to + ' · both totals updated · u to undo');
}

function sendRow(dir){
  const target = S.panel + dir;
  if(target < 0 || target > MEMBERS.length - 1){ say('no member pane that way', true); return; }
  const src = rowsOf(S.panel), sel = S.sel[S.panel], focused = cur();
  const rows = sel.size ? src.filter(t => sel.has(t.id)) : (focused ? [focused] : []);
  if(!rows.length) return;
  const priv = rows.filter(t => t.private);
  if(priv.length){
    pendingSend = target;
    openModal(
      '<h3>Re-attribute a private transaction?</h3>'
      + '<div class="msub">' + MEMBERS[S.panel].name + ' → ' + MEMBERS[target].name + '</div><div class="mbody">'
      + '<div class="warnbox"><span class="g">🔒</span><div>'
      + '<b>' + esc(priv[0].title) + '</b>' + (priv.length > 1 ? ' and ' + (priv.length-1) + ' more' : '')
      + '<br><span style="color:var(--ink-2);font-size:12.5px">This row is hidden from other members. '
      + 'Handing it to ' + MEMBERS[target].name + ' makes them its owner — '
      + MEMBERS[S.panel].name + ' would no longer see it unless they are the admin.</span></div></div>'
      + '<div class="notebox">Nothing is deleted. <kbd>u</kbd> puts both ledgers back.</div></div>'
      + '<div class="mfoot"><button class="btn" data-act="close" type="button">Cancel <kbd>Esc</kbd></button>'
      + '<button class="btn pri" data-act="send" type="button">Re-attribute</button></div>');
    return;
  }
  doSend(target);
}

function move(d){
  const n = Math.max(1, parseInt(S.count||'1',10));
  const len = rowsOf(S.panel).length;
  let f = S.focus[S.panel], steps = 0, guard = 0;
  while(steps < n && guard < len * 2){
    const nf = Math.min(len - 1, Math.max(0, f + d));
    if(nf === f) break;
    f = nf; guard++;
    if(!isFoldedOut(S.panel, f)) steps++;         // folded-closed rows are skipped, like real Vim folds
  }
  S.focus[S.panel] = f;
  S.count=''; render();
}
function switchPanel(p){
  if(p===S.panel) return;
  S.panel = p; S.count=''; render();
  say('panel → ' + MEMBERS[p].name);
}
function toggleSel(){
  const t = cur(); if(!t) return;
  S.sel[S.panel].has(t.id) ? S.sel[S.panel].delete(t.id) : S.sel[S.panel].add(t.id);
  render();
}
function togglePrivate(){
  const t = cur(); if(!t) return;
  t.private = !t.private;
  S.undo.push({k:'private', p:S.panel, id:t.id});
  say(t.private ? 'hidden from other members (admin still sees it)' : 'visible to the household');
}
function softDelete(){
  const t = cur(); if(!t || t.deleted) return;
  t.deleted = true;
  S.undo.push({k:'delete', p:S.panel, id:t.id});
  closeModal();
  say('“' + t.title + '” marked deleted · row kept · u to restore');
}
function doUndo(){
  const a = S.undo.pop();
  if(!a){ say('already at oldest change', true); return; }
  const list = rowsOf(a.p);
  if(a.k === 'delete'){
    const old = list.find(x=>x.id===a.id);
    const i = list.indexOf(old);
    const fresh = T(Object.assign({}, old, {id:++uid, deleted:false, restored:old.id}));
    list.splice(i+1, 0, fresh);
    S.panel = a.p; S.focus[a.p] = Math.max(0, view(a.p).findIndex(t => t.id === fresh.id));
    say('restored as #' + fresh.id + ' → supersedes #' + old.id);
  } else if(a.k === 'add'){
    const i = list.findIndex(x=>x.id===a.id);
    if(i>-1) list.splice(i,1);
    S.focus[a.p] = Math.max(0, Math.min(S.focus[a.p], list.length-1));
    say('add undone');
  } else if(a.k === 'private'){
    const t = list.find(x=>x.id===a.id); if(t) t.private = !t.private;
    say('privacy undone');
  } else if(a.k === 'edit'){
    const t = list.find(x=>x.id===a.id); if(t) Object.assign(t, a.prev);
    say('edit undone');
  } else if(a.k === 'reattr'){
    const A = rowsOf(a.a), B = rowsOf(a.b);
    A.length = 0; A.push(...a.snapA);
    B.length = 0; B.push(...a.snapB);
    S.panel = a.a;
    S.focus = [Math.max(0, Math.min(S.focus[0], rowsOf(0).length - 1)),
               Math.max(0, Math.min(S.focus[1], rowsOf(1).length - 1))];
    say('re-attribution undone · both ledgers restored');
  } else if(a.k === 'reorder'){
    const byId = new Map(list.map(t => [t.id, t]));
    const back = a.order.map(id => byId.get(id)).filter(Boolean);
    list.forEach(t => { if(!a.order.includes(t.id)) back.push(t); });  // rows added since
    list.length = 0; list.push(...back);
    S.panel = a.p;
    say('order restored');
  }
  render();
}

function insertRow(after, data){
  const list = rowsOf(S.panel);
  const row = T(Object.assign({state:'skeleton'}, data));
  if(CFG.sort === 'manual'){
    /* "insert after the current row" only means something in a manual order */
    list.splice(Math.min(list.length, Math.max(0, S.focus[S.panel] + (after?1:0))), 0, row);
  } else {
    list.push(row);
  }
  S.focus[S.panel] = Math.max(0, view(S.panel).findIndex(t => t.id === row.id));
  render();
  setTimeout(() => {
    if(S.online){ row.state = 'ok'; S.undo.push({k:'add', p:S.panel, id:row.id}); say('added #' + row.id); }
    else { row.state = 'error'; say('server unreachable · nothing written', true); }
    render();
  }, 780);
  return row;
}

const CMD_HINT = 'add · in · move · sort · group · set · theme · config · undo · help';
function openCmd(pfx){
  const search = pfx === '/';
  S.mode = search ? 'SEARCH' : 'COMMAND';
  if(search) S.origin = { panel:S.panel, focus:S.focus[S.panel] };
  $('#cmdPfx').textContent = pfx;
  $('#cmdHint').textContent = search ? 'regex ok · Enter keeps it · Esc cancels' : CMD_HINT;
  $('#cmdbar').classList.add('on');

}
function closeCmd(){
  S.mode='NORMAL'; $('#cmdbar').classList.remove('on');

}

function runCmd(raw){
  const s = raw.trim(); if(!s){ closeCmd(); return; }
  const [c, ...rest] = s.split(/\s+/);
  const cmd = c.toLowerCase();
  if(cmd === 'add' || cmd === 'in'){
    const amt = parseFloat(String(rest[0]||'').replace(',','.'));
    if(!isFinite(amt)){ say('need an amount: ' + cmd + ' 50 mercado publix', true); return; }
    const cat = rest[1] || 'sem categoria';
    const desc = rest.slice(2).join(' ');
    const now = new Date();
    insertRow(true, {
      kind: cmd==='in' ? 'in' : 'out',
      status: cmd==='in' ? 'in' : 'plain',
      title: (desc ? cat + ' · ' + desc : cat).replace(/^\w/, m=>m.toUpperCase()),
      /* the first word doubles as a starting `bucket` guess — free, since it was
         typed anyway. Blank stays blank rather than a literal "Sem categoria"
         bucket, so an unbucketed add still lands in the real Uncategorized group. */
      bucket: rest[1] ? cat.replace(/^\w/, m=>m.toUpperCase()) : null,
      amount: amt, day: Math.min(28, now.getDate()),
      private: CFG.default_visibility === 'private'
    });
    closeCmd(); return;
  }
  if(cmd === 'set'){
    const v = (rest[0]||'').toLowerCase();
    if(['nu','rnu','nonu'].includes(v)){ S.nu=v; writeBackLineNumbers(); closeCmd(); say('line numbers → ' + v); }
    else say('set nu | set rnu | set nonu', true);
    return;
  }
  if(cmd === 'next'){ closeCmd(); month(1); return; }
  if(cmd === 'prev'){ closeCmd(); month(-1); return; }
  if(cmd === 'undo'){ closeCmd(); doUndo(); return; }
  if(cmd === 'move'){
    const want = (rest[0] || '').toLowerCase();
    const i = MEMBERS.findIndex(m => m.name.toLowerCase() === want);
    if(i < 0){ say('move ' + MEMBERS.map(m => m.name.toLowerCase()).join(' | '), true); return; }
    if(i === S.panel){ say('already ' + MEMBERS[i].name + "'s", true); return; }
    closeCmd(); sendRow(i - S.panel);
    return;
  }
  if(cmd === 'sort'){
    const v = (rest[0] || '').toLowerCase();
    if(!['manual','date','amount'].includes(v)){ say('sort manual | date | amount', true); return; }
    const keep = cur();
    CFG.sort = v; writeBackKey('sort', v, 'ledger.sort');
    flip(() => {
      if(keep) S.focus[S.panel] = Math.max(0, view(S.panel).findIndex(t => t.id === keep.id));
      render();
    });
    closeCmd();
    say(v === 'manual' ? 'manual order · J/K reorder rows' : 'sorted by ' + v + ' · J/K disabled');
    return;
  }
  if(cmd === 'group'){
    const v = (rest[0] || '').toLowerCase();
    if(!['bucket','none'].includes(v)){ say('group bucket | none', true); return; }
    CFG.group = v;
    clampFocusToVisible(0); clampFocusToVisible(1);
    closeCmd();
    say(v === 'none' ? 'grouping off · flat order restored'
                      : 'grouped by bucket · za toggle · zR/zM open/close all');
    return;
  }
  if(cmd === 'theme'){
    const n = (rest[0] || '').toLowerCase();
    if(!THEMES[n]){ say('unknown theme · ' + THEME_NAMES.join(' '), true); return; }
    const ta = $('#cfgText');
    ta.value = ta.value.replace(/^(\s*name\s*=\s*).*$/m, '$1"' + n + '"');
    applyToml(ta.value);
    closeCmd(); say('theme → ' + n + ' · written to ffm.toml');
    return;
  }
  /* Household-wide and admin-only, same as :sort/:set — never a per-member
     command, since it changes what every member's shared totals look like,
     not just this member's taste. Every fmtMoney() call and the edit-modal
     amount mask both read CFG.currency, so this one write-back is enough
     to make the whole app follow — no per-call-site currency logic to
     keep in sync. */
  if(cmd === 'currency'){
    if(!isAdminNow()){ say('currency is admin-only', true); return; }
    const n = (rest[0] || '').toUpperCase();
    if(!CURRENCIES[n]){ say('currency ' + Object.keys(CURRENCIES).join(' | '), true); return; }
    CFG.currency = n;
    writeBackKey('currency', n, 'locale.currency');
    render();
    closeCmd(); say('currency → ' + n + ' · written to ffm.toml');
    return;
  }
  if(cmd === 'config' || cmd === 'cfg'){ closeCmd(); openCfg(); return; }
  /* Keyboard equivalent of clicking the ADMIN/PREVIEW badge — see
     togglePreview() and the row-component note on why this is "switch my
     own rights off", never "log in as somebody else". */
  if(cmd === 'preview'){ closeCmd(); togglePreview(); return; }
  if(cmd === 'q' && S.cfg){ closeCmd(); closeCfg(); return; }
  if(cmd === 'help' || cmd === 'h'){ closeCmd(); helpModal(); return; }
  say('not a command: ' + cmd + '  (try help)', true);
}

function openModal(html){ $('#modal').innerHTML = html; $('#scrim').classList.add('on'); }
function closeModal(){ $('#scrim').classList.remove('on'); $('#app').focus(); }

/* Ctrl+hjkl moves focus between a modal's fields by screen position rather
   than DOM order, so it keeps working unchanged no matter how a given
   modal's fields are laid out — no per-field row/col bookkeeping to keep in
   sync as fields are added, removed or reordered. Two-phase pick, the same
   shape real spatial-nav (TV remotes, gamepad UIs) uses: first keep only
   fields whose box actually starts on the correct side (a field's left edge
   must clear the current field's left edge to count as "right" of it — a
   full-width field one row down can sit centred close enough to fail this
   and get excluded, where a naive centre-distance metric would wrongly grab
   it); then, among those, prefer ones that overlap the current field on the
   cross axis (same row for h/l, same column for j/k) before falling back to
   nearest-by-distance so j/k tracks straight down a column instead of
   drifting into a wider neighbour. */
const MODAL_DIRS = {h:'left', j:'down', k:'up', l:'right'};
function modalFields(){
  return Array.from($('#modal').querySelectorAll('input,select,textarea'))
    .filter(el => !el.disabled && el.offsetParent !== null);
}
function overlaps1D(aMin, aMax, bMin, bMax){ return aMin < bMax && bMin < aMax; }
function modalFocusMove(dir){
  const els = modalFields();
  if(!els.length) return;
  const from = els.includes(document.activeElement) ? document.activeElement : els[0];
  const a = from.getBoundingClientRect();
  const horiz = dir === 'left' || dir === 'right';
  const inDirection = els.filter(el => el !== from).map(el => ({el, r: el.getBoundingClientRect()}))
    .filter(({r}) => {
      if(dir === 'right') return r.left > a.left + 4;
      if(dir === 'left')  return r.right < a.right - 4;
      if(dir === 'down')  return r.top > a.top + 4;
      return r.bottom < a.bottom - 4; /* up */
    });
  if(!inDirection.length) return;
  const aligned = inDirection.filter(({r}) => horiz
    ? overlaps1D(a.top, a.bottom, r.top, r.bottom)
    : overlaps1D(a.left, a.right, r.left, r.right));
  /* Within the aligned pool the overlap test has already done the real work
     of "same row/column" — the cross-axis term only needs to break near-ties
     (e.g. picking the closer of two equally-adjacent fields in the row
     above). Weighted heavily there, it would let a wide full-row field's
     far-off centre outscore a narrow field's much smaller primary-axis
     distance, which is exactly the bug this function used to have: pressing
     down from a 1-of-3 column field jumped clean over the very next
     full-width row into the one after it. The unaligned fallback pool has
     no such guarantee, so it leans on the cross-axis term much harder to
     approximate "closest in roughly the right direction". */
  const pool = aligned.length ? aligned : inDirection;
  const crossWeight = aligned.length ? 0.2 : 2.2;
  let best = null, bestDist = Infinity;
  for(const {el, r} of pool){
    const dx = (r.left + r.width/2) - (a.left + a.width/2);
    const dy = (r.top + r.height/2) - (a.top + a.height/2);
    const dist = horiz ? Math.abs(dx) + Math.abs(dy) * crossWeight : Math.abs(dy) + Math.abs(dx) * crossWeight;
    if(dist < bestDist){ bestDist = dist; best = el; }
  }
  if(best){ best.focus(); if(best.select) best.select(); }
}

/* The per-member "tag cloud" from CLAUDE.md/spec.md: bucket is free text,
   autocompleted from this member's own prior rows — SELECT DISTINCT bucket
   WHERE member_id = ?, approximated here across every mocked month rather
   than only the one currently in view, since the real query isn't scoped to
   a visible month either. */
function bucketsFor(p){
  const set = new Set();
  MONTHS.forEach(mo => mo.m[p].forEach(t => { if(t.bucket) set.add(t.bucket); }));
  return Array.from(set).sort();
}
/* Rejects a keystroke (or paste/autofill, via the input event rather than
   keydown) outright rather than trying to salvage it — reverting to the
   last known-valid value, not a filtered version of the new one. That
   distinction matters whenever the edit also destroys existing valid text:
   select-all then type a single letter replaces the whole field with just
   "a", and filtering *that* down to digits leaves nothing to recover — the
   prior value is already gone by the time this handler runs. Keeping our
   own last-valid copy sidesteps that entirely. Day is digits only; amount
   is digits plus a single decimal comma, matching how the value is already
   formatted for display (11800,00). */
function restrictToNumeric(el, allowComma){
  const pattern = allowComma ? /^[0-9]*,?[0-9]*$/ : /^[0-9]*$/;
  let last = el.value;
  el.addEventListener('input', () => {
    if(pattern.test(el.value)) last = el.value;
    else el.value = last;
  });
}

/* Money mask for the Amount field: the user only ever types digits — the
   decimal separator and thousands grouping are inserted for them, from the
   household's configured currency (CFG.currency), never hardcoded to
   comma-decimal. The underlying value lives in minor units (cents) on the
   element itself (el.dataset.cents), so saving reads that directly instead
   of re-parsing the formatted display string back apart — the two only
   ever have to agree by construction. */
function maskAmount(el, amount){
  const f = curFmt();
  const toUnits = a => Math.round((a || 0) * Math.pow(10, f.decimals));
  const paint = units => {
    el.dataset.cents = String(units);
    el.value = units ? minorUnitsToDisplay(units, f) : '';
  };
  paint(toUnits(amount));
  el.addEventListener('input', () => {
    const digits = el.value.replace(/[^0-9]/g, '');
    paint(digits ? parseInt(digits, 10) : 0);
    el.setSelectionRange(el.value.length, el.value.length);
  });
}

        : 'off = no filesystem proof; a manual "paid" checkbox appears instead') + '</span></span></label>'
    + (t.tracked
      ? '<label class="f"><span class="k">Instance <span style="text-transform:none;font-weight:400">optional — only if more than one</span></span>'
        + '<input class="i" value="' + esc(t.instance || '') + '" placeholder="e.g. House 8898"></label>'
        + '<div class="notebox mono" style="font-family:var(--mono);font-size:11.5px">path: ' + esc(t.pattern || '—')
        + ' · <span style="color:var(--ink-3)">no regex — bucket / bill name / instance compute it</span></div>'
      : '<label class="switch"><input type="checkbox"' + (t.status==='manual-paid'?' checked':'') + '>'
        + '<span>Mark this month paid manually<span class="d">no file to prove it — shown in a different colour from a verified receipt</span></span></label>')
    + '</div><div class="notebox">Past occurrences already in the ledger are left as they were recorded.</div></div>'
