<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- The install icon: the houses mark from static/icons/favicon.svg on the
     touch icon's opaque tile (a home screen fills transparency with black).
     Rendered to static/icons/ by `just icons`. Maskable: Android crops it to its own shape, so the mark stays inside the middle 80% circle. -->
<rect width="512" height="512" fill="#F6F3ED"/>
<svg x="116" y="116" width="280" height="280" viewBox="-1 -14 120 120">
<defs>
<mask id="family">
<rect x="-1" y="-14" width="120" height="120" fill="white"/>
<circle cx="51" cy="74" r="3.6" fill="black"/>
<path d="M46 90 V85 a5 5 0 0 1 10 0 V90 Z" fill="black"/>
<circle cx="60" cy="81.5" r="2.4" fill="black"/>
<path d="M57 90 V87 a3 3 0 0 1 6 0 V90 Z" fill="black"/>
<circle cx="69" cy="74" r="3.6" fill="black"/>
<path d="M64 90 V85 a5 5 0 0 1 10 0 V90 Z" fill="black"/>
</mask>
</defs>
<polygon fill="#005523" points="4,90 4,66 20,50 36,66 36,90"/>
<polygon fill="#007373" points="44,90 44,50 60,34 76,50 76,90" mask="url(#family)"/>
<polygon fill="#004C73" points="84,90 84,34 100,18 116,34 116,90"/>
<polyline fill="none" stroke="#005523" stroke-width="4.5" stroke-linejoin="round" points="0,59 20,42 40,45 60,26 80,29 100,10 108.7,5"/>
<polygon fill="#005523" points="116.5,0.5 111.2,9.3 106.2,0.7"/>
</svg>
</svg>
