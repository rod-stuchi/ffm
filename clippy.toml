# The three display axes are independent, and fusing them is the mistake
# CLAUDE.md's Conventions section warns about:
#
#   * date format   — FIXED at dd/mm/yyyy. Never localized.
#   * money format  — from household_settings.locale_currency.
#   * language      — from member_settings.language. The words, and only the words.
#
# There is deliberately no `disallowed-methods` entry for chrono's
# `format_localized*` here. It was tried, and clippy correctly reported that the
# path "does not refer to a reachable function" — because Cargo.toml builds
# chrono WITHOUT `unstable-locales`, so the method does not exist at all. A lint
# guarding an unreachable path is a warning on every build that protects nothing.
#
# The enforcement is therefore structural rather than advisory, in three places:
#
#   1. chrono has no `unstable-locales` feature (Cargo.toml says why).
#   2. `ui::fmt::date` takes no language parameter and never will.
#   3. build.rs rejects any `.ftl` message value containing a date pattern or a
#      currency glyph, so the catalog cannot smuggle one in either.
#
# If anyone ever enables `unstable-locales`, re-add the entry — at that point the
# path becomes reachable and the lint starts doing real work.
disallowed-methods = []

# `result_large_err` (on since Rust 1.98) flags `Result<(), Response>`: an axum
# `Response` is 128 bytes, over the default 128-byte threshold. Returning a
# ready-made response as the error — `may_write(...)?` refusing with the
# read-only message — is axum's own early-return idiom, on cold paths, once per
# request. Boxing every one of them would be churn with nothing to show for it.
large-error-threshold = 256
